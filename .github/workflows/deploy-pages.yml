name: Deploy Blue Diamond clone to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the static clone folder as the site root.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bluediamondmed-clone

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
